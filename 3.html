<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runner 極簡影相留底（IndexedDB 慳位版）</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-light: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --border: #475569;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 14px; }

    .wrap { max-width: 640px; margin: 0 auto; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
    }
    .top-bar h1 { margin: 0; font-size: 1.25rem; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { background: var(--card-light); padding: 6px 12px; border-radius: 999px; font-size: 0.92rem; font-weight: 800; color: var(--accent); }
    .pill.warn { color: #fde68a; background: rgba(245, 158, 11, 0.2); }

    .box {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px;
    }

    .photo-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 26px 16px; border-radius: 14px; border: 3px dashed var(--accent);
      background: rgba(56, 189, 248, 0.14); color: #fff; font-size: 1.45rem; font-weight: 900; cursor: pointer;
    }
    .photo-btn:hover { background: rgba(56, 189, 248, 0.22); }

    .preview-img {
      width: 100%; max-height: 320px; object-fit: contain; border-radius: 12px;
      margin-top: 14px; background: #000; display: none; border: 1px solid var(--border);
    }

    .btn-save {
      width: 100%; padding: 20px; font-size: 1.4rem; font-weight: 900; border-radius: 14px;
      border: none; background: var(--green); color: #052e16; cursor: pointer; margin-top: 14px;
    }
    .btn-save:hover { filter: brightness(1.06); }

    .sub-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-sub {
      padding: 13px; font-size: 1rem; font-weight: 700; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card-light); color: #fff; cursor: pointer;
    }
    .btn-clear {
      margin-top: 10px; width: 100%; padding: 11px; font-size: 0.95rem; font-weight: 700;
      border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.12);
      color: #fca5a5; cursor: pointer;
    }

    h2 { margin: 0 0 10px; font-size: 1.15rem; }
    .recent-list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .recent-item {
      background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .recent-left { display: flex; align-items: center; gap: 12px; }
    .recent-thumb {
      width: 58px; height: 58px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--border); background: #000; flex-shrink: 0;
    }
    .recent-time { font-size: 1.05rem; font-weight: 800; }
    .recent-sub { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
    .btn-del {
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-light); color: #fca5a5; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>📷 Runner 影相留底</h1>
    <div class="pills">
      <div class="pill" id="count-pill">已影: 0 張</div>
      <div class="pill warn" id="size-pill">佔用: 0.0 MB</div>
    </div>
  </div>

  <div class="box">
    <label class="photo-btn" for="photo-input">
      📸 影相 / 揀相
    </label>
    <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
    <img id="photo-preview" class="preview-img" alt="相片預覽" />

    <button class="btn-save" type="button" onclick="savePhoto()">✅ 儲存呢張相（下一張）</button>
  </div>

  <div class="box">
    <h2>📋 已影相片清單（交俾 Admin 處理）</h2>
    <div class="sub-actions">
      <button class="btn-sub" type="button" onclick="exportJson()">💾 匯出 JSON（含相片）</button>
      <button class="btn-sub" type="button" onclick="exportCsv()">📊 匯出 CSV 清單</button>
    </div>
    <button class="btn-clear" type="button" onclick="clearAll()">🗑️ 交收完成，清空本機紀錄</button>
    <div class="recent-list" id="recent-list"></div>
  </div>
</div>

<script>
  const DB_NAME = 'RunnerPhotoDB_v1';
  const STORE_NAME = 'photos';
  let db = null;
  let photos = [];
  let draftDataUrl = '';

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          database.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = e => {
        db = e.target.result;
        resolve(db);
      };
      req.onerror = e => reject(e.target.error);
    });
  }

  function getAllFromDb() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        const list = (req.result || []).sort((a, b) => b.id - a.id);
        resolve(list);
      };
      req.onerror = e => reject(e.target.error);
    });
  }

  function putToDb(record) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  }

  function deleteFromDb(id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  }

  function clearDb() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = e => reject(e.target.error);
    });
  }

  // 控制喺 1100px 闊、品質 0.7，兼顧清晰度同細體積
  function compressImage(file, maxWidth = 1100, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const scale = img.width > maxWidth ? maxWidth / img.width : 1;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('photo-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    draftDataUrl = await compressImage(file, 1100, 0.7);
    const img = document.getElementById('photo-preview');
    img.src = draftDataUrl;
    img.style.display = 'block';
  });

  async function savePhoto() {
    if (!draftDataUrl) {
      return alert('請先撳「影相 / 揀相」影低單據或熱感紙！');
    }

    const now = new Date();
    const approxBytes = Math.round((draftDataUrl.length * 3) / 4);
    const record = {
      id: Date.now(),
      timeIso: now.toISOString(),
      timeLabel: now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      bytes: approxBytes,
      photo: draftDataUrl
    };

    try {
      await putToDb(record);
    } catch (_) {
      alert('⚠️ 裝置儲存空間已滿，請先匯出 JSON 並按「清空本機紀錄」釋放空間！');
      return;
    }

    draftDataUrl = '';
    document.getElementById('photo-preview').style.display = 'none';
    document.getElementById('photo-input').value = '';
    photos = await getAllFromDb();
    renderList();
  }

  async function deleteOne(id) {
    await deleteFromDb(id);
    photos = await getAllFromDb();
    renderList();
  }

  async function clearAll() {
    if (!photos.length) return;
    if (!confirm('確定已匯出並交收完成，要清空本機所有相片紀錄嗎？')) return;
    await clearDb();
    photos = [];
    renderList();
  }

  function renderList() {
    const totalBytes = photos.reduce((sum, item) => sum + (item.bytes || (item.photo ? item.photo.length * 0.75 : 0)), 0);
    const mb = (totalBytes / (1024 * 1024)).toFixed(1);

    document.getElementById('count-pill').textContent = `已影: ${photos.length} 張`;
    const sizePill = document.getElementById('size-pill');
    sizePill.textContent = `佔用: ${mb} MB`;
    if (parseFloat(mb) >= 40) {
      sizePill.style.color = '#fca5a5';
    } else {
      sizePill.style.color = '#fde68a';
    }

    const list = document.getElementById('recent-list');
    list.innerHTML = '';

    photos.forEach((item, idx) => {
      const num = photos.length - idx;
      const kb = Math.round((item.bytes || (item.photo ? item.photo.length * 0.75 : 0)) / 1024);
      const div = document.createElement('div');
      div.className = 'recent-item';
      div.innerHTML = `
        <div class="recent-left">
          <img class="recent-thumb" src="${item.photo || ''}" alt="第${num}張" />
          <div>
            <div class="recent-time">#${num} · ${item.timeLabel}</div>
            <div class="recent-sub">約 ${kb} KB · 待 Admin 處理</div>
          </div>
        </div>
        <button class="btn-del" type="button" onclick="deleteOne(${item.id})">刪除</button>
      `;
      list.appendChild(div);
    });
  }

  function exportJson() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(photos, null, 2)], { type: 'application/json' }));
    a.download = `Runner_Photos_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  }

  function exportCsv() {
    const headers = ['Seq', 'Time', 'ISO_Time', 'Approx_KB', 'Has_Photo'];
    const rows = photos.map((p, idx) => [
      photos.length - idx,
      p.timeLabel,
      p.timeIso,
      Math.round((p.bytes || 0) / 1024),
      p.photo ? 'YES' : 'NO'
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = `Runner_Photo_List_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  }

  (async function init() {
    await openDb();
    photos = await getAllFromDb();
    renderList();
  })();
</script>
</body>
</html>
