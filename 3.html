<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runner 入櫃掃描（固定版位 + 轉正 OCR）</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-light: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --border: #475569;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 14px; }

    .wrap { max-width: 740px; margin: 0 auto; }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
    }
    .top-bar h1 { margin: 0; font-size: 1.2rem; }
    .pill { background: var(--card-light); padding: 6px 12px; border-radius: 999px; font-size: 0.92rem; font-weight: 700; }

    .box {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px;
    }
    h2 { margin: 0 0 10px; font-size: 1.15rem; }

    .photo-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 18px; border-radius: 12px; border: 2px dashed var(--accent);
      background: rgba(56, 189, 248, 0.12); color: #fff; font-size: 1.25rem; font-weight: 800; cursor: pointer;
    }

    .preview-img {
      width: 100%; max-height: 280px; object-fit: contain; border-radius: 10px;
      margin-top: 12px; background: #000; display: none; border: 1px solid var(--border);
    }

    .rot-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-rot {
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-light); color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }

    .status-text { margin-top: 10px; font-size: 0.98rem; color: var(--amber); font-weight: 700; min-height: 24px; }

    .door-banner {
      background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-top: 12px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .door-big { font-size: 1.7rem; font-weight: 900; color: var(--accent); }
    .cab-sub { font-size: 0.98rem; color: #cbd5e1; }

    label { display: block; font-size: 0.94rem; font-weight: 700; margin-bottom: 5px; color: #e2e8f0; }
    select, input[type="text"] {
      width: 100%; padding: 11px 12px; font-size: 1.05rem; border-radius: 10px;
      border: 2px solid var(--border); background: #0f172a; color: #fff;
    }
    select:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }

    .btn-save {
      width: 100%; padding: 18px; font-size: 1.28rem; font-weight: 900; border-radius: 12px;
      border: none; background: var(--green); color: #052e16; cursor: pointer; margin-top: 14px;
    }

    details {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px;
    }
    summary { font-weight: 800; font-size: 1rem; cursor: pointer; color: var(--accent); }
    .btn-mini {
      margin-top: 10px; padding: 9px 14px; font-size: 0.92rem; font-weight: 700; border-radius: 8px;
      border: none; background: var(--accent); color: #082f49; cursor: pointer;
    }
    .raw-ocr-box {
      width: 100%; min-height: 110px; margin-top: 10px; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border); background: #0f172a; color: #cbd5e1; font-size: 0.85rem;
    }

    .sub-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-sub {
      padding: 12px; font-size: 0.98rem; font-weight: 700; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card-light); color: #fff; cursor: pointer;
    }
    .recent-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .recent-item {
      background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.92rem;
    }
    .badge-busy { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.82rem; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>🏃 Runner 入櫃掃描（固定版位 OCR）</h1>
    <div class="pill" id="count-pill">已入櫃: 0 / 96</div>
  </div>

  <div class="box">
    <h2>1. 影相 / 識別（Barcode 尾兩位變門號 + 定點 OCR）</h2>

    <label class="photo-btn" for="photo-input">
      📷 點擊影相 / 揀相
    </label>
    <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
    <img id="photo-preview" class="preview-img" alt="相片預覽" />

    <div class="rot-bar">
      <button class="btn-rot" type="button" onclick="rotateAndReocr(90)">↻ 轉 90° 再認</button>
      <button class="btn-rot" type="button" onclick="rotateAndReocr(270)">↺ 轉 270° 再認</button>
      <button class="btn-rot" type="button" onclick="rotateAndReocr(180)">↕ 轉 180° 再認</button>
    </div>

    <div class="status-text" id="status-text"></div>

    <div class="door-banner">
      <div>
        <div class="door-big" id="show-door">Door #01</div>
        <div class="cab-sub" id="show-cab">所屬分區：Cabinet 1（門號 1–40）</div>
      </div>
      <div id="door-status-badge"></div>
    </div>

    <div class="grid-2">
      <div>
        <label for="f-barcode">熱敏紙 Barcode（尾兩位自動變門號）</label>
        <input type="text" id="f-barcode" placeholder="例如: 252208137" oninput="applyDoorFromBarcode()" />
      </div>
      <div>
        <label for="door-select">門號（由 Barcode 尾兩位帶出；可手動改）</label>
        <select id="door-select" onchange="refreshDoorDisplay()"></select>
      </div>
      <div>
        <label for="f-po">PO Number</label>
        <input type="text" id="f-po" placeholder="由 P/O no: 捉出" />
      </div>
      <div>
        <label for="f-grn">Goods Receipt No.</label>
        <input type="text" id="f-grn" placeholder="由 Goods Receipt No.: 捉出" />
      </div>
      <div>
        <label for="f-dept">Department Name</label>
        <input type="text" id="f-dept" placeholder="由 Department: 捉出" />
      </div>
      <div>
        <label for="f-req">Requestor（下方/對應值）</label>
        <input type="text" id="f-req" placeholder="由 Requestor 捉出" />
      </div>
    </div>

    <button class="btn-save" onclick="saveEntry()">✅ 完成入櫃並鎖定門號</button>
  </div>

  <details>
    <summary>⚙️ 自訂 OCR 標籤與檢視原始辨識文字</summary>
    <div class="grid-2">
      <div>
        <label for="cfg-po">PO Number 標籤</label>
        <input type="text" id="cfg-po" />
      </div>
      <div>
        <label for="cfg-grn">Goods Receipt No. 標籤</label>
        <input type="text" id="cfg-grn" />
      </div>
      <div>
        <label for="cfg-dept">Department 標籤</label>
        <input type="text" id="cfg-dept" />
      </div>
      <div>
        <label for="cfg-req">Requestor 標籤</label>
        <input type="text" id="cfg-req" />
      </div>
    </div>
    <button class="btn-mini" type="button" onclick="saveRules()">💾 儲存標籤設定</button>

    <label style="margin-top:12px;" for="raw-ocr-output">辨識原始文字（方便 Admin 對照調校）</label>
    <textarea id="raw-ocr-output" class="raw-ocr-box" readonly placeholder="影相辨識後會顯示喺度..."></textarea>
  </details>

  <div class="box">
    <h2>📋 最近入櫃紀錄與匯出</h2>
    <div class="sub-actions">
      <button class="btn-sub" onclick="exportCsv()">📊 匯出 CSV</button>
      <button class="btn-sub" onclick="exportJson()">💾 匯出 JSON</button>
    </div>
    <div class="recent-list" id="recent-list"></div>
  </div>
</div>

<script>
  const CABINETS = [
    { id: 'CAB1', name: 'Cabinet 1', range: '1–40', start: 1, end: 40 },
    { id: 'CAB2', name: 'Cabinet 2', range: '41–51', start: 41, end: 51 },
    { id: 'CAB3', name: 'Cabinet 3', range: '52–66', start: 52, end: 66 },
    { id: 'CAB4', name: 'Cabinet 4', range: '67–96', start: 67, end: 96 }
  ];

  const DEFAULT_RULES = {
    poLabel: 'P/O no:',
    grnLabel: 'Goods Receipt No.:',
    deptLabel: 'Department:',
    reqLabel: 'Requestor'
  };

  let rules = { ...DEFAULT_RULES, ...JSON.parse(localStorage.getItem('runner_ocr_rules_v4') || '{}') };
  let logs = JSON.parse(localStorage.getItem('runner_logs_v8') || '[]');
  let currentPhoto = '';

  function getCabByDoor(d) {
    return CABINETS.find(c => d >= c.start && d <= c.end);
  }

  function loadRulesToInputs() {
    document.getElementById('cfg-po').value = rules.poLabel;
    document.getElementById('cfg-grn').value = rules.grnLabel;
    document.getElementById('cfg-dept').value = rules.deptLabel;
    document.getElementById('cfg-req').value = rules.reqLabel;
  }

  function saveRules() {
    rules = {
      poLabel: document.getElementById('cfg-po').value.trim() || DEFAULT_RULES.poLabel,
      grnLabel: document.getElementById('cfg-grn').value.trim() || DEFAULT_RULES.grnLabel,
      deptLabel: document.getElementById('cfg-dept').value.trim() || DEFAULT_RULES.deptLabel,
      reqLabel: document.getElementById('cfg-req').value.trim() || DEFAULT_RULES.reqLabel
    };
    localStorage.setItem('runner_ocr_rules_v4', JSON.stringify(rules));
    alert('✅ 已儲存自訂 OCR 標籤！');
  }

  function initSelect() {
    const sel = document.getElementById('door-select');
    sel.innerHTML = '';
    for (let d = 1; d <= 96; d++) {
      const cab = getCabByDoor(d);
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = `Door #${String(d).padStart(2, '0')} (${cab.name}: ${cab.range})`;
      sel.appendChild(opt);
    }
    refreshDoorDisplay();
  }

  function isDoorBusy(d) {
    return logs.some(x => x.door === d && x.status === 'OCCUPIED');
  }

  function refreshDoorDisplay() {
    const d = parseInt(document.getElementById('door-select').value, 10);
    const cab = getCabByDoor(d);
    document.getElementById('show-door').textContent = `Door #${String(d).padStart(2, '0')}`;
    document.getElementById('show-cab').textContent = `所屬分區：${cab.name}（門號 ${cab.range}）`;

    const badge = document.getElementById('door-status-badge');
    badge.innerHTML = isDoorBusy(d)
      ? '<span class="badge-busy">⚠️ 已佔用</span>'
      : '<span style="color:#4ade80; font-weight:700;">🟢 可入櫃</span>';
  }

  function fixDigits(s) {
    return String(s || '')
      .replace(/[Oo]/g, '0')
      .replace(/[Il|]/g, '1')
      .replace(/[Ss]/g, '5');
  }

  function applyDoorFromBarcode() {
    const digits = fixDigits(document.getElementById('f-barcode').value.trim()).replace(/\D/g, '');
    if (digits.length >= 2) {
      const lastTwo = parseInt(digits.slice(-2), 10);
      if (lastTwo >= 1 && lastTwo <= 96) {
        document.getElementById('door-select').value = lastTwo;
        refreshDoorDisplay();
      }
    }
  }

  function loadAndResizeImage(file, maxWidth = 1600) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const scale = img.width > maxWidth ? maxWidth / img.width : 1;
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function rotateImage(dataUrl, deg) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        if (deg === 90 || deg === 270) {
          c.width = img.height;
          c.height = img.width;
        } else {
          c.width = img.width;
          c.height = img.height;
        }
        const ctx = c.getContext('2d');
        ctx.translate(c.width / 2, c.height / 2);
        ctx.rotate((deg * Math.PI) / 180);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = dataUrl;
    });
  }

  // 裁切指定百分比區域 (rx, ry, rw, rh 皆為 0..1) 並做高對比黑白
  function cropRegion(dataUrl, rx, ry, rw, rh) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const sx = Math.round(img.width * rx);
        const sy = Math.round(img.height * ry);
        const sw = Math.max(10, Math.round(img.width * rw));
        const sh = Math.max(10, Math.round(img.height * rh));

        const c = document.createElement('canvas');
        // 放大 1.5 倍方便細字識別
        c.width = Math.round(sw * 1.5);
        c.height = Math.round(sh * 1.5);
        const ctx = c.getContext('2d');
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);

        const id = ctx.getImageData(0, 0, c.width, c.height);
        const d = id.data;
        for (let i = 0; i < d.length; i += 4) {
          let g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          g = ((g - 128) * 1.45) + 128;
          g = Math.max(0, Math.min(255, g));
          d[i] = d[i + 1] = d[i + 2] = g;
        }
        ctx.putImageData(id, 0, 0);
        resolve(c.toDataURL('image/jpeg', 0.88));
      };
      img.src = dataUrl;
    });
  }

  function escapeRegex(str) {
    return String(str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function extractByLabel(rawText, label, belowCount = 1) {
    if (!rawText || !label) return '';
    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const pat = new RegExp(escapeRegex(label), 'i');

    for (let i = 0; i < lines.length; i++) {
      if (pat.test(lines[i])) {
        const after = lines[i].replace(pat, '').replace(/^[:#\-\s]+/, '').trim();
        if (after) return after;
        for (let k = 1; k <= belowCount && i + k < lines.length; k++) {
          const val = lines[i + k].trim();
          if (val && !/[:：]$/.test(val)) return val;
        }
      }
    }
    return '';
  }

  async function ocrOnce(imgUrl) {
    if (typeof Tesseract === 'undefined' || !Tesseract.recognize) return '';
    const res = await Tesseract.recognize(imgUrl, 'eng');
    return res.data?.text || '';
  }

  // 針對打橫/直排版面：先試 90° 同 270° 轉正，再裁切主要文字區辨識
  async function runSmartOcr(dataUrl) {
    const st = document.getElementById('status-text');
    st.textContent = '⏳ 正在轉正並分區辨識 Barcode、PO、GRN、Department、Requestor...';

    let combinedRaw = '';
    const angles = [90, 270, 0];

    for (const deg of angles) {
      const rot = deg === 0 ? dataUrl : await rotateImage(dataUrl, deg);
      // 裁切中下/右半及上半主要文字區（避開左邊手寫大字）
      const mainCrop = await cropRegion(rot, 0.05, 0.05, 0.9, 0.9);
      const txt = await ocrOnce(mainCrop).catch(() => '');
      combinedRaw += `\n--- [${deg}°] ---\n${txt}`;

      if (!document.getElementById('f-barcode').value) {
        const bc = fixDigits(txt).match(/\b([0-9]{8,12})\b/);
        if (bc) {
          document.getElementById('f-barcode').value = bc[1];
          applyDoorFromBarcode();
        }
      }

      if (!document.getElementById('f-po').value) {
        const po = fixDigits(extractByLabel(txt, rules.poLabel, 1)).match(/[0-9A-Za-z-]{4,20}/);
        if (po) document.getElementById('f-po').value = po[0];
      }

      if (!document.getElementById('f-grn').value) {
        const grn = fixDigits(extractByLabel(txt, rules.grnLabel, 1)).match(/[0-9A-Za-z-]{4,20}/);
        if (grn) document.getElementById('f-grn').value = grn[0];
      }

      if (!document.getElementById('f-dept').value) {
        const dept = extractByLabel(txt, rules.deptLabel, 1);
        if (dept) document.getElementById('f-dept').value = dept;
      }

      if (!document.getElementById('f-req').value) {
        const req = extractByLabel(txt, rules.reqLabel, 2);
        if (req) document.getElementById('f-req').value = req;
      }

      // 只要主要欄位已經齊，就唔使再轉其他角度浪費時間
      if (
        document.getElementById('f-barcode').value &&
        document.getElementById('f-po').value &&
        document.getElementById('f-grn').value
      ) {
        break;
      }
    }

    document.getElementById('raw-ocr-output').value = combinedRaw.trim();
    st.textContent = '✅ 辨識完成，請核對欄位（如有漏可點上方轉角度或手動補填）';
  }

  async function rotateAndReocr(deg) {
    if (!currentPhoto) return alert('請先影相或揀相！');
    currentPhoto = await rotateImage(currentPhoto, deg);
    const img = document.getElementById('photo-preview');
    img.src = currentPhoto;
    await runSmartOcr(currentPhoto);
  }

  document.getElementById('photo-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    currentPhoto = await loadAndResizeImage(file, 1600);
    const img = document.getElementById('photo-preview');
    img.src = currentPhoto;
    img.style.display = 'block';
    await runSmartOcr(currentPhoto);
  });

  function saveEntry() {
    const d = parseInt(document.getElementById('door-select').value, 10);
    const cab = getCabByDoor(d);
    const barcode = document.getElementById('f-barcode').value.trim();
    const po = document.getElementById('f-po').value.trim();
    const grn = document.getElementById('f-grn').value.trim();
    const dept = document.getElementById('f-dept').value.trim();
    const requestor = document.getElementById('f-req').value.trim();

    if (!barcode && !po && !grn && !currentPhoto) {
      return alert('請最少影一張相，或輸入 Barcode / PO / GRN！');
    }

    if (isDoorBusy(d)) {
      if (!confirm(`Door #${d} 目前已標記佔用，確定覆蓋嗎？`)) return;
      logs = logs.filter(x => !(x.door === d && x.status === 'OCCUPIED'));
    }

    logs.unshift({
      id: Date.now(),
      time: new Date().toISOString(),
      door: d,
      cabinet: cab.name,
      barcode,
      po,
      grn,
      dept,
      requestor,
      status: 'OCCUPIED',
      photo: currentPhoto
    });

    try {
      localStorage.setItem('runner_logs_v8', JSON.stringify(logs));
    } catch (_) {
      logs = logs.map((item, idx) => idx > 4 ? { ...item, photo: '' } : item);
      localStorage.setItem('runner_logs_v8', JSON.stringify(logs));
    }

    ['f-barcode', 'f-po', 'f-grn', 'f-dept', 'f-req'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('status-text').textContent = '';
    document.getElementById('photo-preview').style.display = 'none';
    document.getElementById('photo-input').value = '';
    currentPhoto = '';

    renderList();
    refreshDoorDisplay();
    alert(`✅ 已記錄 Door #${d}（${cab.name}）`);
  }

  function renderList() {
    const busyCnt = logs.filter(x => x.status === 'OCCUPIED').length;
    document.getElementById('count-pill').textContent = `已入櫃: ${busyCnt} / 96`;

    const list = document.getElementById('recent-list');
    list.innerHTML = '';
    logs.slice(0, 8).forEach(item => {
      const t = new Date(item.time).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = 'recent-item';
      div.innerHTML = `
        <div>
          <strong>Door #${String(item.door).padStart(2, '0')}</strong>（${item.cabinet}）
          <div style="color:#cbd5e1; font-size:0.88rem;">
            ${t} · 碼: ${item.barcode || '—'} · PO: ${item.po || '—'} · GRN: ${item.grn || '—'}
          </div>
        </div>
        <span class="badge-busy">已用</span>
      `;
      list.appendChild(div);
    });
  }

  function exportCsv() {
    const headers = ['Time', 'Cabinet', 'Door', 'Barcode', 'PO', 'GRN', 'Department', 'Requestor', 'Status'];
    const rows = logs.map(r => [
      r.time, r.cabinet, r.door, r.barcode || '', r.po || '', r.grn || '', r.dept || '', r.requestor || '', r.status
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = `Runner_Cabinet_Log_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  }

  function exportJson() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' }));
    a.download = `Runner_Cabinet_Backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  }

  loadRulesToInputs();
  initSelect();
  renderList();
</script>
</body>
</html>
